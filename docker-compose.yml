# Production infrastructure for the AICTE Approval Platform.
# The demo runs with zero infrastructure; start these services when moving to
# the Prisma/PostgreSQL + BullMQ path documented in README.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicte
      POSTGRES_PASSWORD: aicte_dev_password
      POSTGRES_DB: aicte_approval
    ports:
      - "5432:5432"
    volumes:
      - aicte-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte -d aicte_approval"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: aicte-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - aicte-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  aicte-postgres-data:
  aicte-redis-data:
